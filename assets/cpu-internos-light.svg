<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dentro da CPU: quem faz o quê?</title><desc id="desc">Infográfico sobre unidade de controle, ULA, registradores e o fluxo de informação dentro da CPU.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#23324e" flood-opacity=".10"/></filter><style>
.t{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#647087}.h{font:800 28px Inter,Segoe UI,Arial,sans-serif}.b{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.sm{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.mini{font:800 17px Inter,Segoe UI,Arial,sans-serif}.note{font:700 19px Inter,Segoe UI,Arial,sans-serif}.white{fill:#fff}
</style></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="72" text-anchor="middle" class="t">Dentro da CPU: quem faz o quê?</text>
<text x="800" y="112" text-anchor="middle" class="sub">Para executar um programa, a CPU precisa coordenar, calcular e guardar informações por instantes muito curtos.</text>

<g filter="url(#s)"><rect x="35" y="145" width="930" height="700" rx="28" fill="#fff" stroke="#dfe5ef" stroke-width="2"/></g>
<text x="500" y="196" text-anchor="middle" class="h" fill="#3157d5">CPU</text><line x1="90" y1="184" x2="390" y2="184" stroke="#b9c7ff" stroke-width="2"/><line x1="610" y1="184" x2="910" y2="184" stroke="#b9c7ff" stroke-width="2"/>

<!-- control -->
<rect x="80" y="230" width="250" height="245" rx="22" fill="#f4f7ff" stroke="#7ea0ff" stroke-width="2"/>
<rect x="170" y="255" width="70" height="40" rx="5" fill="none" stroke="#3157d5" stroke-width="4"/><line x1="205" y1="295" x2="205" y2="325" stroke="#3157d5" stroke-width="4"/><path d="M205 325l18 18-18 18-18-18z" fill="#3157d5"/><line x1="187" y1="343" x2="150" y2="375" stroke="#3157d5" stroke-width="4"/><line x1="223" y1="343" x2="260" y2="375" stroke="#3157d5" stroke-width="4"/><circle cx="145" cy="380" r="9" fill="none" stroke="#3157d5" stroke-width="4"/><circle cx="265" cy="380" r="9" fill="none" stroke="#3157d5" stroke-width="4"/>
<text x="205" y="416" text-anchor="middle" class="h" font-size="24" fill="#3157d5">Unidade de controle</text><text x="205" y="446" text-anchor="middle" class="sm"><tspan x="205">busca e decodifica instruções;</tspan><tspan x="205" dy="23">coordena os passos da execução</tspan></text>

<!-- ULA -->
<rect x="355" y="230" width="250" height="245" rx="22" fill="#f7f3ff" stroke="#aa94ef" stroke-width="2"/>
<rect x="444" y="260" width="72" height="72" rx="10" fill="none" stroke="#7357d8" stroke-width="4"/><line x1="480" y1="260" x2="480" y2="332" stroke="#7357d8" stroke-width="3"/><line x1="444" y1="296" x2="516" y2="296" stroke="#7357d8" stroke-width="3"/><text x="462" y="287" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#7357d8">+</text><text x="498" y="287" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#7357d8">−</text><text x="462" y="323" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#7357d8">×</text><text x="498" y="323" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#7357d8">÷</text>
<text x="480" y="380" text-anchor="middle" class="h" fill="#7357d8">ULA</text><text x="480" y="420" text-anchor="middle" class="sm"><tspan x="480">realiza operações</tspan><tspan x="480" dy="23">aritméticas e lógicas</tspan></text>

<!-- regs -->
<rect x="630" y="230" width="250" height="245" rx="22" fill="#effaf8" stroke="#6bc9c3" stroke-width="2"/>
<rect x="714" y="255" width="82" height="78" rx="9" fill="none" stroke="#17857b" stroke-width="4"/><g fill="none" stroke="#17857b" stroke-width="3"><rect x="728" y="269" width="54" height="12" rx="2"/><rect x="728" y="289" width="40" height="12" rx="2"/><rect x="728" y="309" width="54" height="12" rx="2"/></g>
<text x="755" y="380" text-anchor="middle" class="h" fill="#17857b">Registradores</text><text x="755" y="420" text-anchor="middle" class="sm"><tspan x="755">armazenam rapidamente</tspan><tspan x="755" dy="23">dados e instruções em uso</tspan></text>
<text x="342" y="350" text-anchor="middle" font-family="Arial" font-size="44" fill="#3157d5">↔</text><text x="618" y="350" text-anchor="middle" font-family="Arial" font-size="44" fill="#3157d5">↔</text>

<text x="500" y="520" text-anchor="middle" class="mini" fill="#3157d5">Como a informação circula</text><line x1="90" y1="510" x2="320" y2="510" stroke="#b9c7ff"/><line x1="680" y1="510" x2="910" y2="510" stroke="#b9c7ff"/>

<!-- flow -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="16">
<rect x="72" y="555" width="125" height="105" rx="16" fill="#edf2ff" stroke="#9ab1ff"/><text x="134" y="615" text-anchor="middle" fill="#3157d5">Memória</text>
<rect x="235" y="555" width="145" height="105" rx="16" fill="#edf2ff" stroke="#9ab1ff"/><text x="307" y="603" text-anchor="middle" fill="#3157d5">Unidade de</text><text x="307" y="626" text-anchor="middle" fill="#3157d5">controle</text>
<rect x="420" y="555" width="135" height="105" rx="16" fill="#eaf8f6" stroke="#7bd5cc"/><text x="488" y="615" text-anchor="middle" fill="#17857b">Registradores</text>
<rect x="595" y="555" width="120" height="105" rx="16" fill="#f2efff" stroke="#b9a7f4"/><text x="655" y="615" text-anchor="middle" fill="#7357d8">ULA</text>
<rect x="755" y="555" width="135" height="105" rx="16" fill="#eaf8f6" stroke="#7bd5cc"/><text x="823" y="615" text-anchor="middle" fill="#17857b">Registradores</text>
</g><g font-family="Arial" font-size="35" fill="#3157d5"><text x="216" y="622">→</text><text x="396" y="622">→</text><text x="568" y="622">↔</text><text x="730" y="622">↔</text></g>

<text x="500" y="704" text-anchor="middle" class="mini" fill="#3157d5">Exemplos de registradores</text>
<rect x="72" y="725" width="818" height="88" rx="16" fill="#fbfcff" stroke="#b9c7ff" stroke-dasharray="6 5"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="92" y="744" width="235" height="50" rx="12" fill="#edf2ff"/><text x="112" y="776" class="mini" fill="#3157d5">PC</text><text x="153" y="765" class="sm"><tspan x="153">endereço da próxima</tspan><tspan x="153" dy="20">instrução</tspan></text><rect x="348" y="744" width="210" height="50" rx="12" fill="#f2efff"/><text x="368" y="776" class="mini" fill="#7357d8">IR</text><text x="404" y="776" class="sm">instrução atual</text><rect x="579" y="744" width="285" height="50" rx="12" fill="#eaf8f6"/><text x="599" y="776" class="mini" fill="#17857b">ACC</text><text x="648" y="765" class="sm"><tspan x="648">resultado</tspan><tspan x="648" dy="20">temporário</tspan></text></g>

<!-- right panel -->
<g filter="url(#s)"><rect x="995" y="145" width="570" height="700" rx="28" fill="#fff" stroke="#dfe5ef" stroke-width="2"/></g>
<circle cx="1050" cy="220" r="34" fill="#edf2ff"/><text x="1050" y="232" text-anchor="middle" font-family="Arial" font-size="32" fill="#3157d5">💡</text>
<text x="1100" y="210" class="h" fill="#3157d5"><tspan x="1100">Por que registradores</tspan><tspan x="1100" dy="34">aparecem agora?</tspan></text>
<text x="1040" y="310" class="b"><tspan x="1040">Durante a execução, o processador precisa saber</tspan><tspan x="1040" dy="30">qual instrução vem em seguida, manter a instrução</tspan><tspan x="1040" dy="30">atual e guardar resultados temporários.</tspan></text>
<rect x="1035" y="420" width="490" height="240" rx="20" fill="#fff8e8" stroke="#f0b35f" stroke-width="2"/><circle cx="1080" cy="470" r="24" fill="#f0a81f"/><text x="1080" y="479" text-anchor="middle" font-family="Arial" font-size="25" fill="#fff">★</text><text x="1120" y="480" class="note" fill="#7a4b08">Nesta aula, basta reconhecer:</text>
<g class="b"><circle cx="1080" cy="530" r="12" fill="#f0a81f"/><text x="1080" y="537" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">✓</text><text x="1110" y="537">a unidade de controle coordena</text><circle cx="1080" cy="575" r="12" fill="#f0a81f"/><text x="1080" y="582" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">✓</text><text x="1110" y="582">a ULA calcula</text><circle cx="1080" cy="620" r="12" fill="#f0a81f"/><text x="1080" y="627" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">✓</text><text x="1110" y="627">registradores guardam valores imediatos</text></g>
<rect x="1035" y="690" width="490" height="110" rx="18" fill="#f4f7ff" stroke="#b9c7ff"/><circle cx="1080" cy="745" r="22" fill="none" stroke="#3157d5" stroke-width="3"/><text x="1080" y="753" text-anchor="middle" font-family="Arial" font-weight="800" font-size="24" fill="#3157d5">i</text><text x="1120" y="730" class="sm"><tspan x="1120">Detalhes como MAR, MBR, flags, pipeline e</tspan><tspan x="1120" dy="24">micro-operações ficam para aprofundamento posterior.</tspan></text>
</svg>