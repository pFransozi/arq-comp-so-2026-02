<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">Da intenção da aplicação à comunicação em rede</title>
  <desc id="desc">Diagrama mostrando uma aplicação enviando uma solicitação pela rede, o sistema operacional coordenando sockets, buffers, pilha de protocolos e driver de rede, e o hardware com CPU, RAM, placa de rede e barramento.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#23313a}
    .title{font-size:18px;font-weight:700}
    .body{font-size:15px}
    .small{font-size:14px}
    .box{fill:#f7fafb;stroke:#7ea1ae;stroke-width:1.8}
    .box2{fill:#eef5f7;stroke:#7ea1ae;stroke-width:1.8}
    .chip{fill:#dbe9ee;stroke:#7ea1ae;stroke-width:1.3}
    .arrow{stroke:#50717d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:7 6}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#50717d"/>
    </marker>
  </defs>

  <rect x="40" y="36" width="250" height="134" rx="18" class="box"/>
  <text x="165" y="68" text-anchor="middle" class="title">Aplicação</text>
  <text x="165" y="102" text-anchor="middle" class="body">Intenção do programa</text>
  <rect x="65" y="116" width="200" height="36" rx="12" class="chip"/>
  <text x="165" y="139" text-anchor="middle" class="body">enviar dados ao servidor</text>

  <rect x="365" y="24" width="255" height="330" rx="18" class="box2"/>
  <text x="492" y="58" text-anchor="middle" class="title">Sistema operacional</text>
  <text x="492" y="84" text-anchor="middle" class="small">coordena a comunicação e os recursos</text>
  <rect x="402" y="108" width="180" height="42" rx="12" class="chip"/>
  <text x="492" y="134" text-anchor="middle" class="body">Socket / interface de rede</text>
  <rect x="402" y="164" width="180" height="42" rx="12" class="chip"/>
  <text x="492" y="190" text-anchor="middle" class="body">Buffers em memória</text>
  <rect x="402" y="220" width="180" height="42" rx="12" class="chip"/>
  <text x="492" y="246" text-anchor="middle" class="body">Pilha de protocolos</text>
  <rect x="402" y="276" width="180" height="42" rx="12" class="chip"/>
  <text x="492" y="302" text-anchor="middle" class="body">Driver de rede</text>

  <rect x="694" y="36" width="246" height="318" rx="18" class="box"/>
  <text x="817" y="68" text-anchor="middle" class="title">Hardware</text>
  <rect x="726" y="100" width="182" height="42" rx="12" class="chip"/>
  <text x="817" y="126" text-anchor="middle" class="body">CPU</text>
  <rect x="726" y="156" width="182" height="42" rx="12" class="chip"/>
  <text x="817" y="182" text-anchor="middle" class="body">Memória RAM</text>
  <rect x="726" y="212" width="182" height="42" rx="12" class="chip"/>
  <text x="817" y="238" text-anchor="middle" class="body">Placa/controlador de rede</text>
  <rect x="726" y="268" width="182" height="42" rx="12" class="chip"/>
  <text x="817" y="294" text-anchor="middle" class="body">Barramento</text>

  <path d="M290 126 C325 126,335 126,365 126" class="arrow"/>
  <path d="M620 238 C650 238,662 238,694 238" class="arrow"/>
  <path d="M694 294 C646 294,635 294,620 294" class="arrow dashed"/>
  <text x="653" y="284" text-anchor="middle" class="small">transmissão / recepção</text>
  <text x="328" y="116" text-anchor="middle" class="small">solicitação</text>

  <rect x="40" y="238" width="250" height="144" rx="18" class="box"/>
  <text x="165" y="270" text-anchor="middle" class="title">Resultado para a aplicação</text>
  <text x="165" y="303" text-anchor="middle" class="body">A resposta chega por uma interface</text>
  <text x="165" y="323" text-anchor="middle" class="body">de software utilizada pelo programa:</text>
  <rect x="67" y="338" width="196" height="28" rx="12" class="chip"/>
  <text x="165" y="357" text-anchor="middle" class="small">dados recebidos do servidor</text>

  <path d="M365 338 C333 338,324 338,290 338" class="arrow"/>
  <text x="329" y="328" text-anchor="middle" class="small">resposta</text>

  <text x="40" y="414" class="small">Ideia central: a aplicação expressa uma intenção de comunicação; o sistema operacional coordena memória, protocolos e hardware de rede.</text>
</svg>