<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 425" role="img" aria-labelledby="title desc">
<title id="title">Hardware de computador e estrutura de software</title>
<desc id="desc">Diagrama em camadas com programas aplicativos, bibliotecas e utilitários, sistema operacional, hardware de execução, barramento, tradução de memória, rede e dispositivos de entrada e saída e memória principal. As interfaces API, ABI e ISA aparecem à esquerda.</desc>
<style>
