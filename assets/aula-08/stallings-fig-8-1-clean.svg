  .small{font-size:15px;font-weight:700;text-anchor:middle}
  .soft{fill:#dfe7e7;stroke:#333;stroke-width:1.2}
  .mid{fill:#b6c9c9;stroke:#333;stroke-width:1.2}
  .light{fill:#ededf0;stroke:#333;stroke-width:1.2}
  .gray{fill:#c9c9cc;stroke:#333;stroke-width:1.2}
  .line{stroke:#333;stroke-width:1.2;fill:none}
</style>
