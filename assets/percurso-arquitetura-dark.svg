<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Percurso da disciplina de Arquitetura de Computadores e Sistemas Operacionais — modo escuro</title>
<desc id="desc">Seis etapas ligadas a um projeto central de processamento concorrente em versão para modo escuro.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1117"/>
    <stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b526d"/>
    <stop offset=".55" stop-color="#193840"/>
    <stop offset="1" stop-color="#6b3c18"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".34"/>
  </filter>
</defs>

<rect width="1600" height="900" rx="42" fill="url(#bg)" stroke="#35404a" stroke-width="2"/>
<text x="800" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#f6f7f8">Percurso da disciplina</text>
<text x="800" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#b8c1cb">Do percurso de uma instrução à defesa de uma aplicação concorrente</text>

<path d="M345 280 C520 205 610 230 705 345" fill="none" stroke="#35a9e0" stroke-width="5" stroke-dasharray="10 12"/>
<path d="M1255 280 C1080 205 990 230 895 345" fill="none" stroke="#f28c28" stroke-width="5" stroke-dasharray="10 12"/>
<path d="M300 600 C500 690 620 650 710 555" fill="none" stroke="#35a9e0" stroke-width="5" stroke-dasharray="10 12"/>
<path d="M1300 600 C1100 690 980 650 890 555" fill="none" stroke="#f28c28" stroke-width="5" stroke-dasharray="10 12"/>

<g filter="url(#shadow)">
  <rect x="570" y="305" width="460" height="285" rx="40" fill="url(#core)" stroke="#58717b" stroke-width="2"/>
  <text x="800" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#83d6f4">Projeto PBL</text>
  <text x="800" y="445" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" fill="#ffffff">Processamento</text>
  <text x="800" y="495" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" fill="#ffffff">Concorrente</text>
  <text x="800" y="545" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#eef3f6">baseline · threads · processos · métricas · defesa</text>
</g>

<g font-family="Inter,Arial,sans-serif">
  <g transform="translate(95 190)">
    <rect width="390" height="170" rx="26" fill="#0c141b" stroke="#35a9e0" stroke-width="3"/>
    <text x="34" y="46" font-size="19" font-weight="800" fill="#35b6ee">01 · CAMADAS E EXECUÇÃO</text>
    <text x="34" y="82" font-size="23" font-weight="750" fill="#f5f7f9">
      <tspan x="34" dy="0">Código → runtime → SO</tspan>
      <tspan x="34" dy="28">→ hardware</tspan>
    </text>
    <text x="34" y="146" font-size="18" fill="#b8c1cb">Organização, instruções e evidências.</text>
  </g>

  <g transform="translate(1115 190)">
    <rect width="390" height="170" rx="26" fill="#0c141b" stroke="#f28c28" stroke-width="3"/>
    <text x="34" y="46" font-size="19" font-weight="800" fill="#f5a23d">02 · RECURSOS</text>
    <text x="34" y="82" font-size="22" font-weight="750" fill="#f5f7f9">
      <tspan x="34" dy="0">CPU · memória ·</tspan>
      <tspan x="34" dy="28">armazenamento</tspan>
    </text>
    <text x="34" y="146" font-size="18" fill="#b8c1cb">Gargalos, localidade, latência e vazão.</text>
  </g>

  <g transform="translate(55 560)">
    <rect width="430" height="170" rx="26" fill="#0c141b" stroke="#35a9e0" stroke-width="3"/>
    <text x="34" y="46" font-size="19" font-weight="800" fill="#35b6ee">03 · SISTEMA OPERACIONAL</text>
    <text x="34" y="86" font-size="24" font-weight="750" fill="#f5f7f9">
      <tspan x="34" dy="0">Kernel · processos ·</tspan>
      <tspan x="34" dy="28">chamadas</tspan>
    </text>
    <text x="34" y="146" font-size="18" fill="#b8c1cb">Abstração, proteção e ambientes de execução.</text>
  </g>

  <g transform="translate(1115 560)">
    <rect width="430" height="170" rx="26" fill="#0c141b" stroke="#f28c28" stroke-width="3"/>
    <text x="34" y="46" font-size="19" font-weight="800" fill="#f28c28">04 · CONCORRÊNCIA</text>
    <text x="34" y="86" font-size="22" font-weight="750" fill="#f5f7f9">
      <tspan x="34" dy="0">Threads · processos ·</tspan>
      <tspan x="34" dy="28">sincronização</tspan>
    </text>
    <text x="34" y="146" font-size="18" fill="#b8c1cb">Corridas, filas, escalonamento e contenção.</text>
  </g>

  <g transform="translate(320 755)">
    <rect width="450" height="105" rx="24" fill="#0b1716" stroke="#4fce9d" stroke-width="3"/>
    <text x="30" y="42" font-size="18" font-weight="800" fill="#55d6a6">05 · PERSISTÊNCIA E INICIALIZAÇÃO</text>
    <text x="30" y="76" font-size="21" font-weight="700" fill="#f5f7f9">Arquivos · segurança · drivers · boot</text>
  </g>

  <g transform="translate(830 755)">
    <rect width="450" height="105" rx="24" fill="#17140a" stroke="#e6b51f" stroke-width="3"/>
    <text x="30" y="42" font-size="18" font-weight="800" fill="#f0c230">06 · VALIDAÇÃO E DEFESA</text>
    <text x="30" y="76" font-size="21" font-weight="700" fill="#f5f7f9">Testes · métricas · ADRs · banca</text>
  </g>
</g>
</svg>
