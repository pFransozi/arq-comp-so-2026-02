<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">O valor armazenado e a interpretação pela aplicação</title>
  <desc id="desc">O padrão de bits 00101010 armazenado na memória pode ser interpretado como número 42, caractere asterisco em ASCII, intensidade de um canal de cor ou parte de uma instrução de máquina.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#a7b7c9" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#f9fbfe"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <!-- título -->
    <text x="800" y="66" text-anchor="middle" font-size="43" font-weight="800" fill="#10203a">
      O valor armazenado e a <tspan fill="#1468e8">interpretação pela aplicação</tspan>
    </text>
    <text x="800" y="108" text-anchor="middle" font-size="22" fill="#53647e">
      Os mesmos bits podem representar coisas diferentes, dependendo de como são interpretados.
    </text>

    <!-- memória -->
    <g filter="url(#shadow)">
      <rect x="55" y="235" width="470" height="300" rx="28" fill="#46566c" stroke="#d7e2ee" stroke-width="3"/>
      <rect x="82" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="134" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="186" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="238" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="290" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="342" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="394" y="214" width="23" height="28" rx="3" fill="#71839a"/><rect x="446" y="214" width="23" height="28" rx="3" fill="#71839a"/>
      <rect x="82" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="134" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="186" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="238" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="290" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="342" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="394" y="528" width="23" height="28" rx="3" fill="#71839a"/><rect x="446" y="528" width="23" height="28" rx="3" fill="#71839a"/>
      <rect x="34" y="268" width="28" height="20" rx="3" fill="#71839a"/><rect x="34" y="316" width="28" height="20" rx="3" fill="#71839a"/><rect x="34" y="364" width="28" height="20" rx="3" fill="#71839a"/><rect x="34" y="412" width="28" height="20" rx="3" fill="#71839a"/><rect x="34" y="460" width="28" height="20" rx="3" fill="#71839a"/>
      <rect x="518" y="268" width="28" height="20" rx="3" fill="#71839a"/><rect x="518" y="316" width="28" height="20" rx="3" fill="#71839a"/><rect x="518" y="364" width="28" height="20" rx="3" fill="#71839a"/><rect x="518" y="412" width="28" height="20" rx="3" fill="#71839a"/><rect x="518" y="460" width="28" height="20" rx="3" fill="#71839a"/>

      <text x="290" y="298" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">Memória</text>
      <text x="290" y="336" text-anchor="middle" font-size="23" fill="#dce6f2">(valor armazenado)</text>
      <rect x="100" y="365" width="380" height="105" rx="16" fill="#eef6ff" stroke="#2f9cff" stroke-width="4"/>
      <text x="290" y="432" text-anchor="middle" font-family="Consolas,monospace" font-size="50" font-weight="800" letter-spacing="9" fill="#10213f">00101010</text>
      <text x="290" y="510" text-anchor="middle" font-size="24" fill="#e5edf8">8 bits (1 byte)</text>
    </g>

    <!-- caixa explicativa -->
    <rect x="58" y="590" width="465" height="125" rx="20" fill="#f4f8fc" stroke="#d7e2ee" stroke-width="2"/>
    <circle cx="105" cy="652" r="27" fill="#247bff"/>
    <text x="105" y="663" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">i</text>
    <text x="150" y="625" font-size="21" fill="#10203a">
      <tspan x="150" dy="0">A memória apenas armazena os bits.</tspan>
      <tspan x="150" dy="30">Ela não sabe o que esses bits</tspan>
      <tspan x="150" dy="30">significam.</tspan>
    </text>

    <!-- setas -->
    <path d="M525 305 H625 Q670 305 690 235 H790" fill="none" stroke="#2f8fff" stroke-width="10" stroke-linecap="round"/>
    <polygon points="790,219 826,235 790,251" fill="#2f8fff"/>
    <path d="M525 365 H645 Q680 365 700 400 H790" fill="none" stroke="#3bd879" stroke-width="10" stroke-linecap="round"/>
    <polygon points="790,384 826,400 790,416" fill="#3bd879"/>
    <path d="M525 430 H640 Q680 430 700 565 H790" fill="none" stroke="#f5ac2d" stroke-width="10" stroke-linecap="round"/>
    <polygon points="790,549 826,565 790,581" fill="#f5ac2d"/>
    <path d="M525 485 H620 Q660 485 680 730 H790" fill="none" stroke="#8d5df6" stroke-width="10" stroke-linecap="round"/>
    <polygon points="790,714 826,730 790,746" fill="#8d5df6"/>

    <!-- painel 1 -->
    <rect x="825" y="160" width="715" height="145" rx="20" fill="#ffffff" stroke="#2f8fff" stroke-width="3"/>
    <rect x="845" y="180" width="92" height="105" rx="18" fill="#e8f3ff"/>
    <text x="891" y="245" text-anchor="middle" font-size="38" font-weight="800" fill="#2f8fff">42</text>
    <text x="965" y="209" font-size="31" font-weight="800" fill="#2f8fff">Como número</text>
    <text x="965" y="245" font-size="20" fill="#53647e">
      <tspan x="965" dy="0">Interpretando como um número</tspan>
      <tspan x="965" dy="28">inteiro sem sinal.</tspan>
    </text>
    <rect x="1360" y="180" width="155" height="105" rx="16" fill="#f4f8fc" stroke="#d7e2ee" stroke-width="2"/>
    <text x="1437" y="232" text-anchor="middle" font-size="42" font-weight="850" fill="#10203a">42</text>
    <text x="1437" y="262" text-anchor="middle" font-size="18" fill="#53647e">(decimal)</text>

    <!-- painel 2 -->
    <rect x="825" y="325" width="715" height="145" rx="20" fill="#ffffff" stroke="#3bd879" stroke-width="3"/>
    <rect x="845" y="345" width="92" height="105" rx="18" fill="#eaf9f0"/>
    <text x="891" y="411" text-anchor="middle" font-size="43" font-weight="800" fill="#36c86f">A</text>
    <text x="965" y="374" font-size="31" font-weight="800" fill="#36c86f">Como caractere</text>
    <text x="965" y="410" font-size="20" fill="#53647e">
      <tspan x="965" dy="0">Interpretando como um caractere</tspan>
      <tspan x="965" dy="28">no código ASCII.</tspan>
    </text>
    <rect x="1360" y="345" width="155" height="105" rx="16" fill="#f4f8fc" stroke="#d7e2ee" stroke-width="2"/>
    <text x="1437" y="401" text-anchor="middle" font-size="51" font-weight="850" fill="#10203a">*</text>
    <text x="1437" y="432" text-anchor="middle" font-size="17" fill="#53647e">ASCII (código 42)</text>

    <!-- painel 3 -->
    <rect x="825" y="490" width="715" height="145" rx="20" fill="#ffffff" stroke="#f5ac2d" stroke-width="3"/>
    <rect x="845" y="510" width="92" height="105" rx="18" fill="#fff6df"/>
    <circle cx="891" cy="562" r="31" fill="#f5ac2d"/>
    <circle cx="879" cy="552" r="5" fill="#354156"/><circle cx="898" cy="544" r="5" fill="#354156"/><circle cx="905" cy="566" r="5" fill="#354156"/>
    <text x="965" y="539" font-size="31" font-weight="800" fill="#e59414">Como cor</text>
    <text x="965" y="574" font-size="19" fill="#53647e">
      <tspan x="965" dy="0">Interpretando como intensidade</tspan>
      <tspan x="965" dy="26">de um canal de cor.</tspan>
      <tspan x="965" dy="26">Ex.: canal vermelho = 42.</tspan>
    </text>
    <rect x="1360" y="510" width="155" height="105" rx="16" fill="#f4f8fc" stroke="#d7e2ee" stroke-width="2"/>
    <rect x="1400" y="526" width="75" height="36" rx="5" fill="#b4264d"/>
    <text x="1437" y="586" text-anchor="middle" font-size="17" font-weight="700" fill="#10203a">Vermelho = 42</text>
    <text x="1437" y="607" text-anchor="middle" font-size="15" fill="#53647e">(0 a 255)</text>

    <!-- painel 4 -->
    <rect x="825" y="655" width="715" height="145" rx="20" fill="#ffffff" stroke="#8d5df6" stroke-width="3"/>
    <rect x="845" y="675" width="92" height="105" rx="18" fill="#f1ebff"/>
    <rect x="865" y="702" width="52" height="52" rx="8" fill="none" stroke="#9b75ff" stroke-width="4"/>
    <text x="891" y="736" text-anchor="middle" font-size="18" font-weight="800" fill="#9b75ff">CPU</text>
    <text x="965" y="704" font-size="31" font-weight="800" fill="#8d5df6">Como instrução</text>
    <text x="965" y="740" font-size="19" fill="#53647e">
      <tspan x="965" dy="0">Interpretando como parte de</tspan>
      <tspan x="965" dy="26">uma instrução de máquina.</tspan>
      <tspan x="965" dy="26">O significado depende da arquitetura.</tspan>
    </text>
    <rect x="1360" y="675" width="155" height="105" rx="16" fill="#f4f8fc" stroke="#d7e2ee" stroke-width="2"/>
    <text x="1437" y="724" text-anchor="middle" font-family="Consolas,monospace" font-size="22" font-weight="800" fill="#10203a">00101010</text>
    <text x="1437" y="752" text-anchor="middle" font-size="15" fill="#53647e">
      <tspan x="1437" dy="0">parte de uma</tspan>
      <tspan x="1437" dy="20">instrução</tspan>
    </text>

    <!-- conclusão -->
    <rect x="55" y="850" width="1490" height="90" rx="20" fill="#fffaf0" stroke="#efc66d" stroke-width="2"/>
    <circle cx="105" cy="895" r="24" fill="#f5b51b"/>
    <text x="105" y="905" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">!</text>
    <line x1="150" y1="870" x2="150" y2="920" stroke="#e5b64c" stroke-width="2"/>
    <text x="190" y="908" font-size="27" font-weight="800" fill="#10203a">Os bits não mudam.</text>
    <text x="455" y="908" font-size="27" font-weight="800" fill="#d39a22">O que muda é a regra usada para interpretá-los.</text>
  </g>
</svg>