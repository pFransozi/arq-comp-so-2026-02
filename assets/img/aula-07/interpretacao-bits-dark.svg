<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">O valor armazenado e a interpretação pela aplicação</title>
  <desc id="desc">O padrão de bits 00101010 armazenado na memória pode ser interpretado como número 42, caractere asterisco em ASCII, intensidade de um canal de cor ou parte de uma instrução de máquina.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0b1423"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="800" y="70" text-anchor="middle" font-size="44" font-weight="800" fill="#f3f7ff">O valor armazenado e a <tspan fill="#2e8cff">interpretação pela aplicação</tspan></text>
    <text x="800" y="112" text-anchor="middle" font-size="23" fill="#b9c7dc">Os mesmos bits podem representar coisas diferentes, dependendo de como são interpretados.</text>

    <!-- memória -->
    <g filter="url(#shadow)">
      <rect x="55" y="245" width="470" height="285" rx="28" fill="#26364d" stroke="#2a3b55" stroke-width="3"/>
      <rect x="80" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="132" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="184" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="236" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="288" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="340" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="392" y="224" width="24" height="28" rx="3" fill="#4a607d"/><rect x="444" y="224" width="24" height="28" rx="3" fill="#4a607d"/>
      <rect x="80" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="132" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="184" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="236" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="288" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="340" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="392" y="523" width="24" height="28" rx="3" fill="#4a607d"/><rect x="444" y="523" width="24" height="28" rx="3" fill="#4a607d"/>
      <text x="290" y="310" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">Memória</text>
      <text x="290" y="345" text-anchor="middle" font-size="23" fill="#d7e1ee">(valor armazenado)</text>
      <rect x="100" y="372" width="380" height="102" rx="16" fill="#172335" stroke="#2f9cff" stroke-width="4"/>
      <text x="290" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="50" font-weight="800" letter-spacing="9" fill="#dff3ff">00101010</text>
      <text x="290" y="506" text-anchor="middle" font-size="24" fill="#e5edf8">8 bits (1 byte)</text>
    </g>

    <rect x="58" y="590" width="465" height="128" rx="20" fill="#122033" stroke="#2a3b55" stroke-width="2"/>
    <circle cx="105" cy="654" r="27" fill="#247bff"/><text x="105" y="665" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">i</text>
    <text x="150" y="627" font-size="22" fill="#f3f7ff">
      <tspan x="150" dy="0">A memória apenas armazena os bits.</tspan>
      <tspan x="150" dy="31">Ela não sabe o que esses bits significam.</tspan>
    </text>

    <!-- setas -->
    <path d="M525 310 H635 Q675 310 690 265 H790" fill="none" stroke="#2f8fff" stroke-width="11" stroke-linecap="round"/><polygon points="790,249 826,265 790,281" fill="#2f8fff"/>
    <path d="M525 365 H650 Q690 365 705 365 H790" fill="none" stroke="#3bd879" stroke-width="11" stroke-linecap="round"/><polygon points="790,349 826,365 790,381" fill="#3bd879"/>
    <path d="M525 420 H640 Q685 420 705 465 H790" fill="none" stroke="#f5ac2d" stroke-width="11" stroke-linecap="round"/><polygon points="790,449 826,465 790,481" fill="#f5ac2d"/>
    <path d="M525 475 H625 Q670 475 690 565 H790" fill="none" stroke="#8d5df6" stroke-width="11" stroke-linecap="round"/><polygon points="790,549 826,565 790,581" fill="#8d5df6"/>

    <!-- painéis -->
    <g>
      <rect x="825" y="175" width="715" height="150" rx="20" fill="#122033" stroke="#2f8fff" stroke-width="3"/>
      <rect x="845" y="196" width="92" height="108" rx="18" fill="#123b68"/>
      <text x="891" y="257" text-anchor="middle" font-size="38" font-weight="800" fill="#2f8fff">42</text>
      <text x="965" y="225" font-size="31" font-weight="800" fill="#2f8fff">Como número</text>
      <text x="965" y="261" font-size="21" fill="#b9c7dc">Interpretando como um número inteiro sem sinal:</text>
      <rect x="1360" y="195" width="155" height="108" rx="16" fill="#0f1a2a" stroke="#2a3b55" stroke-width="2"/>
      <text x="1437" y="249" text-anchor="middle" font-size="42" font-weight="850" fill="#f3f7ff">42</text>
      <text x="1437" y="279" text-anchor="middle" font-size="18" fill="#b9c7dc">(decimal)</text>
    </g>

    <g>
      <rect x="825" y="345" width="715" height="150" rx="20" fill="#122033" stroke="#3bd879" stroke-width="3"/>
      <rect x="845" y="366" width="92" height="108" rx="18" fill="#183c2b"/>
      <text x="891" y="432" text-anchor="middle" font-size="43" font-weight="800" fill="#36c86f">A</text>
      <text x="965" y="395" font-size="31" font-weight="800" fill="#36c86f">Como caractere</text>
      <text x="965" y="431" font-size="21" fill="#b9c7dc">Interpretando como um caractere no código ASCII:</text>
      <rect x="1360" y="365" width="155" height="108" rx="16" fill="#0f1a2a" stroke="#2a3b55" stroke-width="2"/>
      <text x="1437" y="423" text-anchor="middle" font-size="53" font-weight="850" fill="#f3f7ff">*</text>
      <text x="1437" y="455" text-anchor="middle" font-size="17" fill="#b9c7dc">ASCII (código 42)</text>
    </g>

    <g>
      <rect x="825" y="515" width="715" height="150" rx="20" fill="#122033" stroke="#f5ac2d" stroke-width="3"/>
      <rect x="845" y="536" width="92" height="108" rx="18" fill="#493116"/>
      <circle cx="891" cy="590" r="31" fill="#f5ac2d"/><circle cx="879" cy="580" r="5" fill="#354156"/><circle cx="898" cy="572" r="5" fill="#354156"/><circle cx="905" cy="594" r="5" fill="#354156"/>
      <text x="965" y="565" font-size="31" font-weight="800" fill="#e59414">Como cor</text>
      <text x="965" y="600" font-size="20" fill="#b9c7dc">Interpretando como intensidade de um canal de cor.</text>
      <text x="965" y="628" font-size="18" fill="#b9c7dc">Ex.: canal vermelho = 42 em uma escala de 0 a 255.</text>
      <rect x="1360" y="535" width="155" height="108" rx="16" fill="#0f1a2a" stroke="#2a3b55" stroke-width="2"/>
      <rect x="1400" y="552" width="75" height="38" rx="5" fill="#b4264d"/>
      <text x="1437" y="615" text-anchor="middle" font-size="17" font-weight="700" fill="#f3f7ff">Vermelho = 42</text>
      <text x="1437" y="638" text-anchor="middle" font-size="15" fill="#b9c7dc">(0 a 255)</text>
    </g>

    <g>
      <rect x="825" y="685" width="715" height="150" rx="20" fill="#122033" stroke="#8d5df6" stroke-width="3"/>
      <rect x="845" y="706" width="92" height="108" rx="18" fill="#322451"/>
      <rect x="865" y="733" width="52" height="52" rx="8" fill="none" stroke="#9b75ff" stroke-width="4"/><text x="891" y="767" text-anchor="middle" font-size="18" font-weight="800" fill="#9b75ff">CPU</text>
      <text x="965" y="735" font-size="31" font-weight="800" fill="#8d5df6">Como instrução</text>
      <text x="965" y="770" font-size="20" fill="#b9c7dc">Interpretando como parte de uma instrução de máquina.</text>
      <text x="965" y="798" font-size="18" fill="#b9c7dc">O significado depende da arquitetura e da posição do byte.</text>
      <rect x="1360" y="705" width="155" height="108" rx="16" fill="#0f1a2a" stroke="#2a3b55" stroke-width="2"/>
      <text x="1437" y="756" text-anchor="middle" font-family="Consolas,monospace" font-size="23" font-weight="800" fill="#f3f7ff">00101010</text>
      <text x="1437" y="786" text-anchor="middle" font-size="16" fill="#b9c7dc">parte de uma instrução</text>
    </g>

    <rect x="55" y="760" width="700" height="90" rx="20" fill="#121d2e" stroke="#31445f" stroke-width="2"/>
    <text x="90" y="815" font-size="28" font-weight="800" fill="#f3f7ff">Os bits não mudam.</text>
    <text x="340" y="815" font-size="28" font-weight="800" fill="#d39a22">O que muda é a regra usada para interpretá-los.</text>
  </g>
</svg>