<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de execução do código-fonte ao resultado observável</title>
<desc id="desc">O código-fonte passa pelo interpretador Python, pelo sistema operacional e pelo processo em execução. O processo utiliza CPU, memória e entrada e saída. O fluxo retorna ao resultado observável.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6faff"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1677ff"/></marker>
  <style>
    .card{fill:#ffffff;stroke:#1677ff;stroke-width:2}
    .n{fill:#0f76e8}.nt{fill:white;font:700 20px system-ui,-apple-system,'Segoe UI',sans-serif;text-anchor:middle;dominant-baseline:middle}
    .h{fill:#172033;font:700 25px system-ui,-apple-system,'Segoe UI',sans-serif}
    .s{fill:#4e5d73;font:400 17px system-ui,-apple-system,'Segoe UI',sans-serif}
    .line{fill:none;stroke:#1677ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .wire{fill:none;stroke:#1677ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .icon{fill:none;stroke:#1485d1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .tech{fill:none;stroke:#78b8ff;stroke-width:1.5;opacity:.32}
  </style>
</defs>
<rect width="1600" height="700" fill="url(#bg)"/>
<path class="tech" d="M0 110H120l34-34h82M0 145h86l26-26h110M0 520h120l38 38h90M1600 105h-130l-34 34h-82M1600 150h-90l-28 28h-94M1600 520h-128l-34 38h-86"/>
<g class="tech"><circle cx="120" cy="110" r="4"/><circle cx="154" cy="76" r="4"/><circle cx="1436" cy="139" r="4"/><circle cx="1470" cy="105" r="4"/><circle cx="120" cy="520" r="4"/><circle cx="1472" cy="520" r="4"/></g>
<rect class="card" x="230" y="24" rx="18" width="520" height="102"/>
<rect class="n" x="250" y="43" rx="9" width="42" height="42"/><text class="nt" x="271" y="64">1</text>
<g class="icon" transform="translate(318 43)"><path d="M8 0h38l16 16v54H8z"/><path d="M46 0v17h16"/><path d="M27 30l-10 10 10 10M42 30l10 10-10 10"/></g>
<text class="h" x="405" y="64">Código-fonte</text><text class="s" x="405" y="94">Arquivo com instruções e dados.</text>
<rect class="card" x="980" y="24" rx="18" width="390" height="102"/>
<rect class="n" x="1000" y="43" rx="9" width="42" height="42"/><text class="nt" x="1021" y="64">8</text>
