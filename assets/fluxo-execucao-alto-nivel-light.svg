<text class="h" x="1150" y="61">Resultado observável</text><text class="s" x="1150" y="88">Mensagem exibida, arquivo gerado</text><text class="s" x="1150" y="109">e outros rastros.</text>
<rect class="card" x="420" y="160" rx="16" width="540" height="82"/>
<rect class="n" x="440" y="180" rx="8" width="38" height="38"/><text class="nt" x="459" y="199">2</text>
<rect x="510" y="176" width="58" height="48" rx="14" fill="#edf5ff" stroke="#176b87" stroke-width="2"/><text x="539" y="207" fill="#176b87" font="700 24px system-ui" text-anchor="middle">Py</text>
<text class="h" x="600" y="196">Interpretador Python</text><text class="s" x="600" y="222">Lê o script e inicia a execução.</text>
<rect class="card" x="420" y="260" rx="16" width="540" height="82"/>
<rect class="n" x="440" y="280" rx="8" width="38" height="38"/><text class="nt" x="459" y="299">3</text>
<g class="icon" transform="translate(510 276)"><circle cx="28" cy="25" r="20"/><circle cx="28" cy="25" r="8"/><path d="M28 0v6M28 44v6M3 25h6M47 25h6M10 7l5 5M41 38l5 5M46 7l-5 5M15 38l-5 5"/></g>
<text class="h" x="600" y="296">Sistema Operacional</text><text class="s" x="600" y="322">Cria e gerencia processo, memória, CPU e E/S.</text>
<rect class="card" x="420" y="360" rx="16" width="540" height="82"/>
<rect class="n" x="440" y="380" rx="8" width="38" height="38"/><text class="nt" x="459" y="399">4</text>
<g class="icon" transform="translate(510 377)"><rect x="0" y="0" width="62" height="48" rx="5"/><path d="M0 12h62M14 24l9 7-9 7M31 38h14"/><circle cx="9" cy="6" r="1.5" fill="#1485d1" stroke="none"/><circle cx="15" cy="6" r="1.5" fill="#1485d1" stroke="none"/></g>
<text class="h" x="600" y="396">Processo em execução</text><text class="s" x="600" y="422">Instância do programa em funcionamento.</text>
<path class="line" d="M490 126V154"/><path class="line" d="M690 242V254"/><path class="line" d="M690 342V354"/>
<path class="wire" d="M690 442V470H365V490M690 470V490M690 470H1095V490"/>
<path class="line" d="M365 470V490"/><path class="line" d="M690 470V490"/><path class="line" d="M1095 470V490"/>
<rect class="card" x="170" y="495" rx="16" width="390" height="105"/>
<rect class="n" x="190" y="515" rx="8" width="38" height="38"/><text class="nt" x="209" y="534">5</text>
<g class="icon" transform="translate(260 515)"><rect x="10" y="8" width="44" height="44" rx="5"/><rect x="21" y="19" width="22" height="22" rx="3"/><path d="M18 0v8M30 0v8M42 0v8M18 52v8M30 52v8M42 52v8M2 16h8M2 28h8M2 40h8M54 16h8M54 28h8M54 40h8"/></g>
<text class="h" x="345" y="538">CPU</text><text class="s" x="345" y="568">Executa as instruções.</text>
<rect class="card" x="600" y="495" rx="16" width="340" height="105"/>
<rect class="n" x="620" y="515" rx="8" width="38" height="38"/><text class="nt" x="639" y="534">6</text>
<g class="icon" transform="translate(690 518)"><rect x="0" y="0" width="74" height="42" rx="6"/><rect x="10" y="10" width="12" height="20" rx="2"/><rect x="29" y="10" width="12" height="20" rx="2"/><rect x="48" y="10" width="12" height="20" rx="2"/><path d="M12 42v8M25 42v8M38 42v8M51 42v8M64 42v8"/></g>
<text class="h" x="790" y="535">Memória</text><text class="s" x="790" y="562">Mantém código, objetos</text><text class="s" x="790" y="584">e variáveis.</text>
<rect class="card" x="980" y="495" rx="16" width="430" height="105"/>
<rect class="n" x="1000" y="515" rx="8" width="38" height="38"/><text class="nt" x="1019" y="534">7</text>
<g class="icon" transform="translate(1060 517)"><rect x="0" y="0" width="52" height="38" rx="5"/><path d="M10 14l8 6-8 6M24 29h12"/><path d="M38 23h31v27H38zM46 23v-7h13l6 7"/></g>
<text class="h" x="1150" y="535">E/S / arquivos / terminal</text><text class="s" x="1150" y="562">Interação com arquivos,</text><text class="s" x="1150" y="584">saída e dispositivos.</text>
<path class="wire" d="M365 600V620H1095V600M690 600V620"/>
<path class="wire" d="M1095 620H1175V145"/>
<path class="line" d="M1175 145V132"/>
<rect x="70" y="646" width="1460" height="38" rx="14" fill="#f6faff" stroke="#b9d7ff"/>
<circle cx="105" cy="665" r="12" fill="none" stroke="#1677ff" stroke-width="2"/><text x="105" y="671" fill="#1677ff" font="700 18px system-ui" text-anchor="middle">i</text>
<text x="135" y="671" fill="#4e5d73" font="400 16px system-ui,-apple-system,'Segoe UI',sans-serif">Do código-fonte ao resultado observável: a execução desce pelas camadas do sistema e retorna como resultado por meio de CPU, memória e E/S.</text>
</svg>